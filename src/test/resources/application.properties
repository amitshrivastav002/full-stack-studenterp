# Tests run against an in-memory database so no PostgreSQL instance is needed.
spring.datasource.url=jdbc:h2:mem:studenterp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=TestOnlyJwtSecretKeyThatIsLongEnoughForHs256Signing1234567890
jwt.expiration=3600000

file.upload-dir=target/test-uploads

app.bootstrap.admin-password=
razorpay.key-id=
razorpay.key-secret=

razorpay.webhook-secret=TestWebhookSecret123
