spring.application.name=studenterp

# ---------------------------------------------------------------- datasource
# Credentials come from the environment in every real deployment; the defaults
# below only exist so a local checkout runs without extra setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# --------------------------------------------------------------------- auth
# Override jwt.secret in production. It must be at least 32 characters for HS256.
jwt.secret=${JWT_SECRET:StudentERPJwtSecretKey2026ForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth client ID from Google Cloud Console (Credentials > OAuth client ID > Web
# application). Must match the one the frontend loads (VITE_GOOGLE_CLIENT_ID).
google.client-id=${GOOGLE_CLIENT_ID:624883496383-o2bhqgl77equfpd9crfhumnohc0se4e8.apps.googleusercontent.com}

# Creates the first administrator on an empty database. Account creation is an
# admin-only endpoint, so without this nobody can sign in to a fresh install.
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@studenterp.local}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_BOOTSTRAP_ADMIN_NAME:System Administrator}

# ------------------------------------------------------------------- clients
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# ------------------------------------------------------------------- uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# ------------------------------------------------------------------- library
app.library.fine-per-day=${LIBRARY_FINE_PER_DAY:5.00}
app.library.max-books-per-student=${LIBRARY_MAX_BOOKS:3}

# ------------------------------------------------------------------ payments
# Set these through environment variables or an untracked local profile.
# Never commit a live Razorpay secret.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_live_TZR0N4RAHDsnpk}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:hVxDf8eWWoa9NsR466OvoqIZ}

# Webhook signing secret from Dashboard > Settings > Webhooks (NOT the API secret).
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
